<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Threads Authorization Callback</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <section class="card">
        <p class="eyebrow">Academy Sentiment Research</p>
        <h1 id="title">Processing Threads authorization…</h1>
        <p id="message">
          This page processes the authorization result locally in your browser.
          It does not transmit or store the authorization code.
        </p>
        <button id="copy-code" type="button" hidden>Copy authorization code</button>
        <p id="copy-status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const error = params.get("error_description") || params.get("error");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const copyButton = document.getElementById("copy-code");
      const copyStatus = document.getElementById("copy-status");

      if (code) {
        title.textContent = "Threads authorization received";
        message.textContent =
          "Return to the setup workflow to exchange this one-time code for an access token. The code is not stored by this page.";
        copyButton.hidden = false;
        copyButton.addEventListener("click", async () => {
          await navigator.clipboard.writeText(code);
          copyStatus.textContent = "Authorization code copied.";
        });
      } else if (error) {
        title.textContent = "Threads authorization was not completed";
        message.textContent = error;
      } else {
        title.textContent = "No authorization result found";
        message.textContent = "Start the authorization flow from the Meta app setup.";
      }
    </script>
  </body>
</html>
